name: lama
channels:
  - pytorch  # 优先从 PyTorch 官方源下载，确保版本匹配
  - nvidia   # NVIDIA 官方源，获取 CUDA 12.1 相关依赖
  - conda-forge
  - defaults
dependencies:
  # 1. 基础环境（适配 CUDA 12.1 + RTX 4090）
  - python=3.8.16  # 稳定兼容 PyTorch 2.1+ 和 CUDA 12.1
  - pip=23.3.1     # 升级 pip，避免安装依赖时版本冲突

  # 2. 核心深度学习库（关键：适配 CUDA 12.1）
  - pytorch=2.1.2  # PyTorch 2.1.2 原生支持 CUDA 12.1，完美适配 RTX 4090
  - torchvision=0.16.2  # 与 PyTorch 2.1.2 配套，支持图像预处理
  - torchaudio=2.1.2    # 音频处理库（若用不到可删除）
  - pytorch-cuda=12.1   # 明确绑定 CUDA 12.1（由 NVIDIA 源提供，避免版本 mismatch）

  # 3. 图像处理与工具库（兼容 CUDA 12.1 + Python 3.8）
  - albumentations=2.0.5  # 最新稳定版，修复旧 API 问题，支持新环境
  - opencv-python=4.8.0.76 # 适配 CUDA 12.1 的 OpenCV，支持 GPU 加速
  - kornia=0.7.2          # 图像特征库，兼容 PyTorch 2.1+
  - hydra-core=1.3.2      # 配置管理工具，解决之前的 `hydra.core` 缺失问题
  - scikit-image=0.21.0   # 图像处理库，适配 Python 3.8+
  - scikit-learn=1.3.2    # 机器学习库，兼容新环境

  # 4. 科学计算与基础依赖（稳定版，无冲突）
  - numpy=1.26.3
  - pandas=2.0.3
  - matplotlib=3.7.5
  - pillow=10.2.0
  - yaml=0.2.5

  # 5. Pip 补充依赖（原配置中必要的包，保留并适配）
  - pip:
    - webdataset==0.1.76        # 数据集加载工具
    - wldhx-yadisk-direct==0.0.6 # Yandex Disk 下载工具
    - imgaug==0.4.0             # 图像增强库（兼容 albumentations 2.0.5）
    - shapely==2.0.1            # 几何计算库（升级到适配 Python 3.8 的版本）
